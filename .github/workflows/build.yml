name: Build Sanguine OS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate and Run Build Script in Docker
        run: |
          cat << 'EOF' > run_build.sh
          #!/bin/bash
          set -e

          echo "==> Initializing Pacman Keyring..."
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm archiso git sed

          echo "==> Setting up Archiso build directory..."
          mkdir -p /tmp/archiso-build
          cp -r /usr/share/archiso/configs/releng/* /tmp/archiso-build/

          echo "==> Branding Sanguine OS..."
          sed -i 's/iso_name="archlinux"/iso_name="sanguine-os"/' /tmp/archiso-build/profiledef.sh
          sed -i 's/iso_publisher="Arch Linux <https:\/\/archlinux.org>"/iso_publisher="Sanguine OS"/' /tmp/archiso-build/profiledef.sh
          sed -i 's/iso_application="Arch Linux Live\/Rescue DVD"/iso_application="Sanguine OS Live System"/' /tmp/archiso-build/profiledef.sh

          echo 'sanguine-os' > /tmp/archiso-build/airootfs/etc/hostname
          echo 'Welcome to Sanguine OS' > /tmp/archiso-build/airootfs/etc/issue

          echo 'NAME="Sanguine OS"' > /tmp/archiso-build/airootfs/etc/os-release
          echo 'PRETTY_NAME="Sanguine OS"' >> /tmp/archiso-build/airootfs/etc/os-release
          echo 'ID=sanguine' >> /tmp/archiso-build/airootfs/etc/os-release
          echo 'ID_LIKE=arch' >> /tmp/archiso-build/airootfs/etc/os-release

          echo "==> Enabling Multilib Repository (for Steam/Gaming)..."
          sed -i '/\[multilib\]/,/Include/ s/^#//' /tmp/archiso-build/pacman.conf

          echo "==> Injecting packages.x86_64..."
          cat /workspace/packages.x86_64 >> /tmp/archiso-build/packages.x86_64

          echo "==> Enabling SDDM (KDE Login) & NetworkManager..."
          mkdir -p /tmp/archiso-build/airootfs/etc/systemd/system/display-manager.service.wants/
          ln -sf /usr/lib/systemd/system/sddm.service /tmp/archiso-build/airootfs/etc/systemd/system/display-manager.service

          mkdir -p /tmp/archiso-build/airootfs/etc/systemd/system/multi-user.target.wants/
          ln -sf /usr/lib/systemd/system/NetworkManager.service /tmp/archiso-build/airootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service

          echo "==> Building Sanguine OS ISO..."
          mkdir -p /workspace/out
          cd /tmp/archiso-build
          mkarchiso -v -w /tmp/archiso-work -o /workspace/out .
          EOF

          chmod +x run_build.sh
          docker run --privileged --rm -v $(pwd):/workspace archlinux:latest bash /workspace/run_build.sh

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0"
          name: "Sanguine OS v1.0"
          body: "Official build of Sanguine OS with KDE Plasma, Gaming, Coding, and Pentesting tools."
          files: out/*.iso
